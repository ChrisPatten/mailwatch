[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mailwatch"
version = "0.1.0"
description = "A quarantined email reader for AI agents: read-only IMAP, tool-less model calls, a code-enforced link broker."
readme = "README.md"
license = {text = "MIT"}
keywords = ["email", "imap", "llm", "agents", "prompt-injection", "security"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Topic :: Communications :: Email",
  "Topic :: Security",
]
requires-python = ">=3.10"
dependencies = [
  "imapclient>=3.0",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "httpx>=0.27",
  "pdfplumber>=0.11",
  "icalendar>=5.0",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "trafilatura>=1.8",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
ocr = ["ocrmac>=1.0; sys_platform == 'darwin'"]
dev = ["pytest>=8"]

[project.scripts]
mailwatch = "mailwatch.cli:main"

[tool.setuptools.packages.find]
include = ["mailwatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
